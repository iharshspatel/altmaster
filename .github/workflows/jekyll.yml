name: Deploy Jekyll site to Pages

# Build and deploy on every push to main — including the commits the blog CMS
# makes when a post is published. Also runnable manually from the Actions tab.
on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Permissions the deploy needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish; don't cancel it mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      # Safety net: Jekyll only publishes _posts files named YYYY-MM-DD-*.md.
      # If the CMS ever saves a post without the date prefix (e.g. a slug edit
      # dropped it), restore the prefix from the post's own `date:` field so the
      # post still goes live instead of silently vanishing.
      - name: Ensure post date prefixes
        run: |
          shopt -s nullglob
          for f in _posts/*.md; do
            base=$(basename "$f")
            case "$base" in
              [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]-*) continue ;;
            esac
            date=$(grep -m1 -E '^date:' "$f" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            if [ -n "$date" ]; then
              echo "::warning::Restoring missing date prefix: $base -> $date-$base"
              mv "$f" "_posts/$date-$base"
            else
              echo "::error::$base has no date prefix and no parseable date: field — it will not publish."
            fi
          done
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
